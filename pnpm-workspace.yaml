packages:
  - apps/*
  - packages/*

allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true

catalog:
  "@earendil-works/pi-agent-core": ^0.84.4
  "@earendil-works/pi-ai": ^0.84.4
  "@earendil-works/pi-coding-agent": ^0.84.4
  "@earendil-works/pi-session-backend-sqlite-node": ^0.84.4
  "@earendil-works/pi-telemetry": ^0.84.4
  "@electric-sql/pglite": ^0.5.8
  "@electric-sql/pglite-pgvector": ^0.0.9
  "@types/node": ^24
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  typebox: ^1.3.7
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  zod: ^4.5.4
  bumpp: ^11.1.0

catalogMode: prefer

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
