packages:
  - apps/*
  - packages/*

allowBuilds:
  "@google/genai": true
  electron: true
  electron-winstaller: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true

catalog:
  "@byc/electron-vite-plus": ^0.0.2
  "@earendil-works/pi-agent-core": ^0.85.1
  "@earendil-works/pi-ai": ^0.85.1
  "@earendil-works/pi-coding-agent": ^0.85.1
  "@earendil-works/pi-session-backend-sqlite-node": ^0.85.1
  "@earendil-works/pi-telemetry": ^0.85.1
  "@electric-sql/pglite": ^0.5.8
  "@electric-sql/pglite-pgvector": ^0.0.9
  "@electron-toolkit/tsconfig": ^2.0.0
  "@huggingface/transformers": ^4.2.0
  "@modelcontextprotocol/client": ^2.0.0
  "@oxc-node/cli": ^0.1.0
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  "@vuetify/v0": ^1.2.1
  "vue": "rc"
  "@vue/compiler-core": "rc"
  "@vue/compiler-dom": "rc"
  "@vue/compiler-sfc": "rc"
  "@vue/compiler-ssr": "rc"
  "@vue/compiler-vapor": "rc"
  "@vue/reactivity": "rc"
  "@vue/runtime-core": "rc"
  "@vue/runtime-dom": "rc"
  "@vue/runtime-vapor": "rc"
  "@vue/server-renderer": "rc"
  "@vue/shared": "rc"
  "@vue/compat": "rc"
  bumpp: ^11.1.0
  cn: ^0.2.5
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  tailwindcss: ^4.3.3
  typebox: ^1.3.7
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  zod: ^4.5.4
  lucide-vue-next: ^1.0.0
  markstream-vue: ^2.0.7
  "@vitejs/plugin-vue": ^6.0.8
  "@viyuni/rolldown-plugin-tailwindcss": ^0.0.1
  veldorajs: ^0.0.1

catalogMode: prefer

minimumReleaseAgeExclude:
  - "@earendil-works/chord@0.85.1"
  - "@earendil-works/pi-agent-core@0.85.1"
  - "@earendil-works/pi-ai@0.85.1"
  - "@earendil-works/pi-telemetry@0.85.1"
  - "@byc/electron-vite-plus@0.0.2"
  - "@orpc/client@2.0.0-beta.33"
  - "@orpc/contract@2.0.0-beta.33"
  - "@orpc/server@2.0.0-beta.33"
  - "@orpc/shared@2.0.0-beta.33"
  - veldorajs@0.0.1 || 0.0.2 || 0.0.3

overrides:
  onnxruntime-node: 1.27.0
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - "vue"
    - vite
    - vitest
  allowedVersions:
    vite: "*"
